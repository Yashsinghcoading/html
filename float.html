<!DOCTYPE html>
<html>
    <head>
    <style>
        img#flowerRight {
            float: right;
            width: 100px;
            height: 100px;
        }
        img#flowerLeft {
            float: left;
            width: 100px;
            height: 100px;
        }
    </style>
    </head>
    <body>
        <h2>Float Right</h2>
        <p>In this example, the image will float right to the peragraph, and the text in the peragraph will wrap around the image</p>
        <img id="flowerRight" src="flower2.webp" alt="tree">
        <img id="flowerLeft" src="flower1.png" alt="tree">
    </body>
</html>

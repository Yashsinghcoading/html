<!DOCTYPE html>
<html>
    <head>
        <title>css box model example</title>
        <style>
            .example1{
                width: 220px;
                background-color: #E67514;
                padding: 0;
                border: 0;
                margin: 0;
            }
            .example2{
                width: 220px;
                background-color: #00809D;
                padding: 80px;
                border: 10px solid #131D4F;
                margin: 60px 60px;
            }
        </style>
    </head>
    <body>
        <h1>box model example</h1>
        <p class="example1">my content example 1</p>
        <p class="example2">my content example 2</p>
    </body>
</html>
